name: synology spk

# Fork-only workflow. Builds Synology DSM 7 packages (.spk) of upstream
# gtsteffaniak/filebrowser releases, with the fork overlay applied on top:
#   - backend/cmd/synology_thumbs.go + backend/internal/synothumb  (@eaDir video thumbnails)
#   - synology/                                                    (packaging)
# The upstream source is fetched at build time, so this fork never needs to be
# merged with upstream for a new release to be packaged.

on:
  schedule:
    - cron: "17 3 * * *" # daily: package new upstream releases
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream tag to package (e.g. v2.1.5-beta). Empty = newest stable and newest beta."
        required: false
        default: ""
      force:
        description: "Build even if this upstream tag was already released here"
        type: boolean
        default: false
      publish:
        description: "Create a GitHub release (otherwise only workflow artifacts)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - "synology/**"
      - "backend/cmd/synology_thumbs.go"
      - "backend/internal/synothumb/**"
      - ".github/workflows/synology-spk.yaml"

permissions:
  contents: write

concurrency:
  group: synology-spk
  cancel-in-progress: false

env:
  UPSTREAM_REPO: gtsteffaniak/filebrowser

jobs:
  resolve:
    name: Find upstream releases to package
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.pick.outputs.tags }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.upstream_tag }}
          # A push only re-packages already released versions when the commit message says so.
          FORCE: ${{ inputs.force || (github.event_name == 'push' && contains(github.event.head_commit.message, '[rebuild]')) }}
        run: |
          set -euo pipefail
          all="$(git ls-remote --tags --refs "https://github.com/${UPSTREAM_REPO}.git" 'v*' \
                 | sed 's#.*refs/tags/##' \
                 | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-(stable|beta)$' | sort -V)"
          if [ -n "${INPUT_TAG}" ]; then
            echo "${all}" | grep -qx "${INPUT_TAG}" || { echo "::error::${INPUT_TAG} is not an upstream stable/beta tag"; exit 1; }
            candidates="${INPUT_TAG}"
          else
            candidates="$(echo "${all}" | grep -- '-stable$' | tail -n1; echo "${all}" | grep -- '-beta$' | tail -n1)"
          fi
          # Releases of this fork are tagged "<upstream tag>-syno.<build number>".
          released="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].tag_name' || true)"
          picked=()
          for tag in ${candidates}; do
            if [ "${FORCE}" != "true" ] && echo "${released}" | grep -q "^${tag}-syno\."; then
              echo "already packaged: ${tag}"
              continue
            fi
            picked+=("${tag}")
          done
          json="$(printf '%s\n' "${picked[@]:-}" | jq -R . | jq -cs 'map(select(length > 0))')"
          echo "tags=${json}" >> "${GITHUB_OUTPUT}"
          echo "Will package: ${json}" | tee -a "${GITHUB_STEP_SUMMARY}"

  build:
    name: Build ${{ matrix.tag }}
    needs: resolve
    if: needs.resolve.outputs.tags != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.resolve.outputs.tags) }}
    steps:
      - name: Checkout fork overlay
        uses: actions/checkout@v4
        with:
          path: overlay

      - name: Checkout upstream ${{ matrix.tag }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ matrix.tag }}
          path: src

      - name: Apply overlay
        run: |
          set -euo pipefail
          cp overlay/backend/cmd/synology_thumbs.go src/backend/cmd/
          rm -rf src/backend/internal/synothumb
          cp -r overlay/backend/internal/synothumb src/backend/internal/

      - name: Versions
        id: ver
        run: |
          set -euo pipefail
          tag="${{ matrix.tag }}"                 # v2.1.5-beta
          base="${tag#v}"; base="${base%%-*}"      # 2.1.5
          channel="${tag##*-}"                     # beta | stable
          build="$(printf '%04d' "${GITHUB_RUN_NUMBER}")"
          ffmpeg_image="$(sed -nE 's/^FROM[[:space:]]+([^[:space:]]*ffmpeg[^[:space:]]*)[[:space:]]+AS[[:space:]]+ffmpeg.*/\1/Ip' src/_docker/Dockerfile | head -n1)"
          [ -n "${ffmpeg_image}" ] || { echo "::error::could not find the ffmpeg image in upstream _docker/Dockerfile"; exit 1; }
          {
            echo "spk_version=${base}-${build}"
            echo "channel=${channel}"
            echo "release_tag=${tag}-syno.${GITHUB_RUN_NUMBER}"
            echo "ffmpeg_image=${ffmpeg_image}"
            echo "upstream_sha=$(git -C src rev-parse --short HEAD)"
          } | tee -a "${GITHUB_OUTPUT}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: src/frontend/.nvmrc

      - name: Build frontend (embedded into the binary)
        working-directory: src/frontend
        run: npm i && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum

      - uses: goto-bus-stop/setup-zig@v2

      - name: Build static backend binaries (same flags as upstream .goreleaser.yaml)
        working-directory: src/backend
        run: |
          set -euo pipefail
          go mod download
          go run ./scripts/setup-gofitz-cgo
          ldflags="-s -w \
            -X github.com/gtsteffaniak/filebrowser/backend/internal/version.Version=${{ matrix.tag }}-syno \
            -X github.com/gtsteffaniak/filebrowser/backend/internal/version.CommitSHA=${{ steps.ver.outputs.upstream_sha }}"
          mkdir -p "${GITHUB_WORKSPACE}/dist/amd64" "${GITHUB_WORKSPACE}/dist/arm64"
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 CC="zig cc -target x86_64-linux-musl" \
            go build -tags analytics,mupdf,musl -ldflags "${ldflags}" -o "${GITHUB_WORKSPACE}/dist/amd64/filebrowser" .
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC="zig cc -target aarch64-linux-musl" \
            go build -tags analytics,mupdf,musl -ldflags "${ldflags}" -o "${GITHUB_WORKSPACE}/dist/arm64/filebrowser" .
          file "${GITHUB_WORKSPACE}"/dist/*/filebrowser
          # Synology uses glibc; a musl binary only runs there when it is fully static.
          # (A static binary has no PT_INTERP program header, i.e. needs no dynamic loader.)
          for f in "${GITHUB_WORKSPACE}"/dist/*/filebrowser; do
            if readelf -lW "${f}" | grep -q INTERP; then echo "::error::${f} is not statically linked"; exit 1; fi
          done

      - uses: docker/setup-qemu-action@v3

      - name: Fetch ffmpeg/ffprobe (the build upstream ships in its Docker image)
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker pull -q --platform "linux/${arch}" "${{ steps.ver.outputs.ffmpeg_image }}"
            id="$(docker create --platform "linux/${arch}" "${{ steps.ver.outputs.ffmpeg_image }}" /ffmpeg)"
            docker cp "${id}:/ffmpeg" "dist/${arch}/ffmpeg"
            docker cp "${id}:/ffprobe" "dist/${arch}/ffprobe"
            docker rm "${id}" > /dev/null
            chmod 755 dist/${arch}/*
            for b in ffmpeg ffprobe; do
              echo "::notice::${arch} ${b}: $(file -b "dist/${arch}/${b}" | cut -c1-160)"
              if readelf -lW "dist/${arch}/${b}" | grep -q INTERP; then
                echo "::error::${b} (${arch}) needs a dynamic loader: $(readelf -lW "dist/${arch}/${b}" | grep -A1 INTERP | tail -n1 | tr -s ' ')"
                exit 1
              fi
            done
          done

      - name: Test thumbnail generator with the bundled ffmpeg
        working-directory: src/backend
        run: PATH="${GITHUB_WORKSPACE}/dist/amd64:${PATH}" go test -v ./internal/synothumb/

      - name: Smoke test binaries on a glibc system
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            docker run --rm --platform "linux/${arch}" -v "${PWD}/dist/${arch}:/b:ro" debian:stable-slim \
              sh -c '/b/filebrowser version && /b/ffmpeg -version | head -n1 && /b/ffprobe -version | head -n1'
          done

      - name: Build .spk packages
        run: |
          set -euo pipefail
          command -v convert > /dev/null || command -v magick > /dev/null \
            || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          mkdir -p out
          for arch in amd64 arm64; do
            for variant in alias portonly; do
              bash overlay/synology/build-spk.sh \
                --arch "${arch}" \
                --variant "${variant}" \
                --version "${{ steps.ver.outputs.spk_version }}" \
                --upstream-tag "${{ matrix.tag }}" \
                --bin-dir "dist/${arch}" \
                --icon src/frontend/public/img/icons/favicon.png \
                --out-dir out
            done
          done
          ls -l out
          # The package must contain runnable binaries and syntactically valid scripts.
          mkdir check && tar -xf out/FileBrowserQuantum-x86_64-${{ steps.ver.outputs.spk_version }}.spk -C check
          tar -tzvf check/package.tgz | grep -E '^-rwxr-xr-x .* \./bin/(filebrowser|ffmpeg|ffprobe)$' | wc -l | grep -qx 3
          for s in check/scripts/*; do sh -n "${s}"; done
          jq -e . check/conf/resource check/conf/privilege > /dev/null
          mkdir check/target && tar -xzf check/package.tgz -C check/target && jq -e . check/target/ui/config > /dev/null
          (cd out && sha256sum *.spk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: spk-${{ matrix.tag }}
          path: out/
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: overlay
        run: |
          set -euo pipefail
          prerelease=""
          [ "${{ steps.ver.outputs.channel }}" = "stable" ] || prerelease="--prerelease"
          cat > ../notes.md <<EOF
          Synology DSM 7.2+ package of FileBrowser Quantum **${{ matrix.tag }}** with bundled FFmpeg.

          - Upstream release notes: https://github.com/${UPSTREAM_REPO}/releases/tag/${{ matrix.tag }}
          - Package version: \`${{ steps.ver.outputs.spk_version }}\`
          - FFmpeg: \`${{ steps.ver.outputs.ffmpeg_image }}\`

          | NAS CPU | File |
          |---|---|
          | Intel / AMD (x86_64) | \`FileBrowserQuantum-x86_64-${{ steps.ver.outputs.spk_version }}.spk\` |
          | ARM 64-bit (aarch64) | \`FileBrowserQuantum-aarch64-${{ steps.ver.outputs.spk_version }}.spk\` |

          The \`-portonly\` files are a fallback that does not touch DSM's web server (no QuickConnect
          access, port 8580 only). Use one only if the normal package fails to install.

          Install or update: Package Center → Manual Install → pick the .spk. See \`synology/README.md\`.
          EOF
          sed -i 's/^          //' ../notes.md
          gh release create "${{ steps.ver.outputs.release_tag }}" ../out/*.spk ../out/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "FileBrowser Quantum ${{ matrix.tag }} for Synology (build ${GITHUB_RUN_NUMBER})" \
            --notes-file ../notes.md ${prerelease}

  catalog:
    name: Update Package Center source
    # A static "package source" for DSM (Package Center > Settings > Package Sources),
    # published on the gh-pages branch. One file per CPU family and channel because a
    # static host cannot filter by the architecture DSM sends in its query.
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success' && needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: frontend/public/img/icons
      - name: Generate catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Served straight from the branch by raw.githubusercontent.com: no GitHub Pages needed.
          site_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages"
          mkdir -p site dl
          touch site/.nojekyll
          command -v convert > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          for size in 72 120; do
            convert frontend/public/img/icons/favicon.png -resize "${size}x${size}" "site/icon_${size}.png"
          done

          tags="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[] | select(.draft | not) | .tag_name')"
          for channel in stable beta; do
            tag="$(echo "${tags}" | grep -E "^v[0-9.]+-${channel}-syno\.[0-9]+$" | sort -V | tail -n1 || true)"
            [ -n "${tag}" ] || { echo "no ${channel} release yet"; continue; }
            rm -rf dl/* && gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir dl --pattern '*.spk'
            for arch in x86_64 aarch64; do
              spk="$(ls dl/FileBrowserQuantum-${arch}-*.spk | grep -v portonly | head -n1)"
              name="$(basename "${spk}")"
              version="${name#FileBrowserQuantum-${arch}-}"; version="${version%.spk}"
              prefix=""; [ "${channel}" = "stable" ] || prefix="beta-"
              jq -n \
                --arg version "${version}" \
                --arg desc "FileBrowser Quantum ${tag%-syno.*}: web file manager with bundled FFmpeg. Writes video thumbnails for File Station, Synology Drive and Synology Photos." \
                --arg link "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/${name}" \
                --arg md5 "$(md5sum "${spk}" | cut -d' ' -f1)" \
                --argjson size "$(stat -c %s "${spk}")" \
                --arg changelog "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${tag}" \
                --arg t72 "${site_url}/icon_72.png" --arg t120 "${site_url}/icon_120.png" \
                '{packages: [{
                    package: "FileBrowserQuantum", version: $version, dname: "FileBrowser Quantum",
                    desc: $desc, link: $link, md5: $md5, size: $size, changelog: $changelog,
                    thumbnail: [$t72, $t120],
                    maintainer: "FileBrowser Quantum (community Synology package)",
                    maintainer_url: "https://github.com/gtsteffaniak/filebrowser",
                    qinst: true, qupgrade: true, qstart: true, beta: false,
                    os_min_ver: "7.2-64561", deppkgs: null, conflictpkgs: null
                 }]}' > "site/${prefix}${arch}.json"
              echo "${prefix}${arch}.json -> ${name}" | tee -a "${GITHUB_STEP_SUMMARY}"
            done
          done

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "${remote}" gh-pages > /dev/null; then
            git clone -q --depth 1 --branch gh-pages "${remote}" pages
          else
            mkdir pages && git -C pages init -q -b gh-pages && git -C pages remote add origin "${remote}"
          fi
          cp -a site/. pages/
          cd pages
          git add -A
          if git diff --cached --quiet; then echo "catalog unchanged"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update Synology package source"
          git push -q origin gh-pages
