# Included into DSM's own nginx server blocks (ports 5000/5001 and DSM custom domains)
# through the "web-config" resource worker. Serving FileBrowser Quantum under the DSM
# origin is what makes it reachable through QuickConnect.
#
# Only core nginx directives and built-in variables are used on purpose: an unknown
# variable here would make DSM's whole nginx configuration invalid.
location = /filebrowser {
    return 301 /filebrowser/;
}

location /filebrowser/ {
    proxy_pass http://127.0.0.1:8580;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Large uploads/downloads and server-sent events: stream, do not buffer or cap.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 60s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;
}
